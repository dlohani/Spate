<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A5BEA"/><stop offset="0.5" stop-color="#1E9ED6"/><stop offset="1" stop-color="#6A4BE6"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A1A4A" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="102" y="102" width="820" height="410" rx="184" fill="url(#gl)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer streams: thinner at the top, meeting the trunk -->
    <path d="M282 286 C282 420, 470 430, 500 520" stroke-width="58"/>
    <path d="M742 286 C742 420, 554 430, 524 520" stroke-width="58"/>
    <path d="M512 272 L512 520" stroke-width="58"/>
    <!-- trunk + head -->
    <path d="M512 500 L512 746" stroke-width="84"/>
    <path d="M352 606 L512 766 L672 606" stroke-width="84"/>
  </g>
</svg>
