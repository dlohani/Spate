# winget manifest (singleton) for Spate. Publish spate-windows-<version>-amd64-setup.exe
# as a GitHub release, fill in InstallerUrl/InstallerSha256, then submit to
# github.com/microsoft/winget-pkgs (or use a private REST source).
# Then:  winget install DeepakLohani.Spate
PackageIdentifier: DeepakLohani.Spate
PackageVersion: 1.0.0
PackageName: Spate
Publisher: Deepak Lohani
License: MIT
ShortDescription: Download manager with browser capture, parallel connections and resume
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://github.com/dlohani/Spate/releases/download/v1.0.0/spate-windows-1.0.0-amd64-setup.exe
    InstallerSha256: REPLACE_WITH_SHA256_OF_spate-windows-1.0.0-amd64-setup.exe
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
ManifestType: singleton
ManifestVersion: 1.6.0
