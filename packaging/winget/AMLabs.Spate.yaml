# winget manifest (singleton) for Spate. Publish Spate-Setup-<version>.exe
# as a GitHub release, fill in InstallerUrl/InstallerSha256, then submit to
# github.com/microsoft/winget-pkgs (or use a private REST source).
# Then:  winget install AMLabs.Spate
PackageIdentifier: AMLabs.Spate
PackageVersion: 0.4.0
PackageName: Spate
Publisher: AMLabs
License: MIT
ShortDescription: Download manager with browser capture, parallel connections and resume
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://github.com/dlohani/Spate/releases/download/v0.4.0/Spate-Setup-0.4.0.exe
    InstallerSha256: REPLACE_WITH_SHA256_OF_Spate-Setup-0.4.0.exe
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
ManifestType: singleton
ManifestVersion: 1.6.0
