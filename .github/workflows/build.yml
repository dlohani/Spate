name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - run: go vet ./...
      - run: go test -race ./...
      - run: scripts/test/run.sh
      - name: core stays standard-library only
        run: |
          if grep -q '^require' go.mod; then echo "go.mod has a require block; the core must stay standard-library only" >&2; exit 1; fi

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Flutter analyze and FFI test against the real core
        run: |
          make lib
          cd apps/flutter && flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: build
        run: ./build mac extension --no-test
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/macos/*
            dist/extension/*
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: macos-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev
      - name: Flutter analyze and FFI test against the real core
        run: |
          make lib
          cd apps/flutter && flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: build
        run: ./build linux --no-test
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: "dist/linux/*", retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with:
          name: linux-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  windows:
    needs: test
    runs-on: windows-2022
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: toolchain (MinGW for the DLL, NSIS for the installer)
        run: choco install mingw nsis -y --no-progress
      - name: toolchain check
        # A step's PATH is fixed at job start; if either command is missing
        # after the install above, append the install folder to $GITHUB_PATH
        # in the previous step (choco prints where it installed) and re-run.
        run: |
          gcc --version | head -1
          makensis -VERSION
          7z | head -2
      - name: Flutter Windows UI (builds spate.dll natively when absent)
        shell: pwsh
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
        run: powershell -ExecutionPolicy Bypass -File scripts\flutter-windows.ps1 -CopyTo (Get-Location).Path
      - name: what the Flutter build changed in the tree (a dirty tree taints the label)
        run: git status --porcelain && git diff --stat
      - name: package
        env:
          CC: gcc
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
        run: ./build windows --no-test
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: "dist/windows/*", retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  # Releases attach the macOS, Linux, and Windows installers and extensions
  # along with SHA256SUMS. On tagged releases (v*), a full production release
  # is published. On pushes to main, a rolling 'latest' release is updated.
  release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: verify tag matches VERSION if tagged
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="$(tr -d '[:space:]' < VERSION)"
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $v" >&2; exit 1; }
          fi
      - uses: actions/download-artifact@v7
        with: { name: macos, path: release }
      - uses: actions/download-artifact@v7
        with: { name: linux, path: release }
      - uses: actions/download-artifact@v7
        with: { name: windows, path: release }
      - name: checksums
        run: |
          cd release
          find . -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's| \./| |' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: publish release with installers attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          files="$(find release -type f ! -name '*.sha256' | sort | tr '\n' ' ')"

          cat << 'EOF' > release_notes.md
          ## Spate v1.0.0

          The fast, lightweight download manager for macOS, Linux, and Windows that finishes what your browser starts.

          ### ✨ Key Features
          - **Multi-Connection Acceleration**: Up to 32 parallel connections with dynamic work-stealing.
          - **Resilient Resume**: Seamlessly recovers interrupted transfers after network drops or sleep.
          - **Browser Integration**: Hand-off extensions for Chrome, Brave, Edge, Firefox, and Safari.
          - **Smart Organization**: Rule-based folder sorting, bandwidth throttling, and scheduled transfers.
          - **Pure & Lightweight**: Self-contained ~20 MB engine with native tray integration.

          ### 📦 Installation Packages
          | Platform | Package | Notes |
          |---|---|---|
          | **macOS** | `Spate-1.0.0.pkg` | Apple Silicon & Intel (per-user install) |
          | **Linux** | `spate_1.0.0_amd64.deb` | Debian & Ubuntu packages |
          | **Windows** | `Spate-Setup-1.0.0.exe` | Windows NSIS installer |
          | **Browser** | `spate-extension.zip` | Chrome, Brave, Edge, Firefox extension |
          | **Safari** | `Spate-for-Safari.pkg` | Safari web extension companion |

          ### 🔐 Integrity Verification
          Verify package integrity using the included `SHA256SUMS`:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" $files \
              --title "Spate $v" \
              --notes-file release_notes.md \
              || gh release upload "${GITHUB_REF_NAME}" $files --clobber
          else
            gh release create "latest" $files \
              --prerelease \
              --title "Spate (Latest Build)" \
              --notes "Automated rolling release from commit ${GITHUB_SHA}. Verify with SHA256SUMS." \
              || gh release upload "latest" $files --clobber
          fi
