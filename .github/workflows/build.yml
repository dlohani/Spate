name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - run: go vet ./...
      - run: go test -race ./...
      - run: scripts/test/run.sh
      - name: browser extension tests
        run: |
          for f in browser/extension/*.js; do node --check "$f"; done
          node --test browser/test/*.test.js
      - name: core stays standard-library only
        run: |
          if grep -q '^require' go.mod; then echo "go.mod has a require block; the core must stay standard-library only" >&2; exit 1; fi

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Go vet and tests on macOS
        run: |
          go vet ./...
          go test ./...
      - name: Flutter analyze and FFI test against the real core
        run: |
          make lib
          cd apps/flutter && flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: build
        run: ./build mac extension --no-test
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
      - name: install smoke test (package installs, is universal, uninstalls)
        run: |
          set -x
          pkg="$(ls dist/macos/Spate-*.pkg | head -1)"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          # Where the installer actually put the app (shown for diagnosis).
          pkgutil --volume "$HOME" --pkg-info com.amlabs.spate.app || true
          ls -la "$HOME/Applications" || true
          app="$HOME/Applications/Spate.app"
          support="$HOME/Library/Application Support/spate"
          test -d "$app"
          test -x "$support/bin/spate-host"
          test -f "$support/extension/manifest.json"
          for f in "$support/bin/spate-host" "$app/Contents/Frameworks/libspate.dylib" "$app/Contents/MacOS/spate_app"; do
            lipo "$f" -verify_arch arm64
            lipo "$f" -verify_arch x86_64
          done
          "$support/bin/uninstall"
          test ! -e "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/macos/*
            dist/extension/*
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: macos-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev libnotify-dev
      - name: Flutter analyze and FFI test against the real core
        run: |
          make lib
          cd apps/flutter && flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: build
        run: ./build linux --no-test
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
      - name: install smoke test (package installs with its declared dependencies, removes cleanly)
        run: |
          set -x
          deb="$(ls dist/linux/spate_*_amd64.deb | head -1)"
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/spate
          test -x /usr/lib/spate/spate-host
          test -x /usr/lib/spate/spate_app/spate_app
          test -f /usr/share/spate/extension/manifest.json
          test -f /etc/opt/chrome/native-messaging-hosts/com.amlabs.spate.host.json
          test -f /usr/lib/mozilla/native-messaging-hosts/com.amlabs.spate.host.json
          # Every shared library the app links must come from a declared dependency.
          if ldd /usr/lib/spate/spate_app/spate_app /usr/lib/spate/spate_app/lib/*.so | grep "not found"; then exit 1; fi
          sudo apt-get remove -y spate
          test ! -e /usr/lib/spate/spate-host
          test ! -e /etc/opt/chrome/native-messaging-hosts/com.amlabs.spate.host.json
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: "dist/linux/*", retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with:
          name: linux-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  windows:
    needs: test
    runs-on: windows-2022
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: install garble (release obfuscation)
        run: |
          go install mvdan.cc/garble@v0.18.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: toolchain (MinGW for the DLL, NSIS for the installer)
        run: choco install mingw nsis -y --no-progress
      - name: toolchain check
        # A step's PATH is fixed at job start; if either command is missing
        # after the install above, append the install folder to $GITHUB_PATH
        # in the previous step (choco prints where it installed) and re-run.
        run: |
          gcc --version | head -1
          makensis -VERSION
          7z | head -2
      - name: Go vet and tests on Windows
        # The Linux job cannot catch Windows-only behaviour (file sharing
        # rules, path separators, the native host's launch code). The
        # installer package is left out: it embeds a payload that only exists
        # after packaging.
        run: |
          go vet ./internal/... ./cmd/spate ./cmd/spate-host
          go test ./internal/... ./cmd/spate ./cmd/spate-host
      - name: Flutter Windows UI (builds spate.dll natively when absent)
        shell: pwsh
        env:
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
        run: powershell -ExecutionPolicy Bypass -File scripts\flutter-windows.ps1 -CopyTo (Get-Location).Path
      - name: what the Flutter build changed in the tree (a dirty tree taints the label)
        run: git status --porcelain && git diff --stat
      - name: package
        env:
          CC: gcc
          SPATE_OBFUSCATE: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '' }}
        run: ./build windows --no-test
      - name: install smoke test (silent install puts the files and registry keys in place)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\windows\Spate-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Spate'
          foreach ($f in 'bin\spate-host.exe', 'bin\spate.dll', 'bin\spate_app\spate_app.exe', 'extension\manifest.json', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "missing after install: $f" }
          }
          foreach ($k in 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.amlabs.spate.host', 'HKCU:\Software\Mozilla\NativeMessagingHosts\com.amlabs.spate.host') {
            if (-not (Test-Path $k)) { throw "missing registry key: $k" }
          }
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: "dist/windows/*", retention-days: 7 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-debug-symbols
          path: dist/debug-symbols/**
          if-no-files-found: ignore
          retention-days: 30

  # Releases attach the macOS, Linux, and Windows installers and extensions
  # along with SHA256SUMS. A tag (v*) creates a draft release to check and
  # publish by hand. A push to main creates a prerelease for that build.
  release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: verify tag matches VERSION if tagged
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="$(tr -d '[:space:]' < VERSION)"
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $v" >&2; exit 1; }
          fi
      - uses: actions/download-artifact@v7
        with: { name: macos, path: release }
      - uses: actions/download-artifact@v7
        with: { name: linux, path: release }
      - uses: actions/download-artifact@v7
        with: { name: windows, path: release }
      - name: checksums
        run: |
          cd release
          find . -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -exec sha256sum {} \; | sed 's| \./| |' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: publish release with installers attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          files="$(find release -type f ! -name '*.sha256' | sort | tr '\n' ' ')"

          cat << 'EOF' > release_notes.md
          ## Spate v@V@

          The fast, lightweight download manager for macOS, Linux, and Windows that finishes what your browser starts.

          ### ✨ Key Features
          - **Multi-Connection Acceleration**: Up to 32 parallel connections with dynamic work-stealing.
          - **Resilient Resume**: Seamlessly recovers interrupted transfers after network drops or sleep.
          - **Browser Integration**: Hand-off extensions for Chrome, Brave, Edge and Firefox (Safari is experimental and built from source).
          - **Smart Organization**: Rule-based folder sorting, bandwidth throttling, and scheduled transfers.
          - **Pure & Lightweight**: Self-contained ~20 MB engine with native tray integration.

          ### 📦 Installation Packages
          | Platform | Package | Notes |
          |---|---|---|
          | **macOS** | `Spate-@V@.pkg` | Apple Silicon & Intel (per-user install) |
          | **Linux** | `spate_@V@_amd64.deb` | Debian & Ubuntu packages |
          | **Windows** | `Spate-Setup-@V@.exe` | Windows NSIS installer |
          | **Chrome, Brave, Edge** | `spate-extension-@V@.zip` | Unzip, then Load unpacked |
          | **Firefox** | `spate-extension-firefox-@V@.zip` | Unzip, then Load Temporary Add-on |

          The installers are not code-signed yet, so macOS Gatekeeper and Windows SmartScreen warn on first run.

          ### 🔐 Integrity Verification
          Verify package integrity using the included `SHA256SUMS`:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF
          # The notes name the files by version: fill it in from VERSION so
          # they cannot drift from what is attached.
          sed -i "s/@V@/$v/g" release_notes.md

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A draft: check the attached files, then publish it by hand.
            gh release create "${GITHUB_REF_NAME}" $files \
              --draft \
              --title "Spate $v" \
              --notes-file release_notes.md \
              || gh release upload "${GITHUB_REF_NAME}" $files --clobber
          else
            # A build of main. The repository has immutable releases on, so a
            # rolling release under one fixed tag is not possible: a published
            # release cannot be changed and its tag name can never be used
            # again. Each main build is therefore its own prerelease under a
            # unique tag, and only the newest five are kept.
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            gh release create "$tag" $files \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Spate $v build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
              --notes "Automated build of main at commit ${GITHUB_SHA}. Not a release: use the latest numbered version unless you are testing. Verify with SHA256SUMS."
            gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              -q '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
              | while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done
          fi
